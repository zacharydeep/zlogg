name: "Baseline Build"

# Secret-free build/test gate for the locked toolchain (C++20 / Qt 6.8 / CMake).
# This is the authoritative milestone-1 gate: it builds `ci_build` and runs the
# full ctest suite on Windows and macOS. Unlike ci-build.yml it does not sign,
# notarize or package, so it needs no release secrets and stays green.
# Sentry is disabled here: its bundled crashpad does not configure against the
# macOS 14 runner SDK. Sentry-enabled builds are covered by ci-build.yml.
# See VERIFIED_TOOLCHAIN.md.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Baseline (${{ matrix.config.os }}-${{ matrix.config.os_version }}, ${{ matrix.config.label }})
    strategy:
      fail-fast: false
      # EXPERIMENT: three independent builds, each one running every test case
      # separately so a failure can be attributed to a single scenario.
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: build-1
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: build-2
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: build-3
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Set brew env
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        if: ${{ matrix.config.os == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build
      - name: Verify specs match, then bisect
        shell: sh
        run: |
          cd "$KLOGG_BUILD_ROOT"
          rm -rf case_failures && mkdir -p case_failures
          ./output/klogg_itests.exe -platform offscreen --list-tests > list_tests.log 2>&1 || true
          echo "=== registered tests ==="
          grep -v '^$' list_tests.log | head -30

          matched_cases() {
            sed -n 's/.*in \([0-9][0-9]*\) test cases.*/\1/p' "$1" | tail -1
          }

          run_spec() {
            expected="$1"; reps="$2"; shift 2
            ok=0; failed=0; mismatched=0
            safe=$(echo "$*" | tr -c 'A-Za-z0-9._-' '_')
            for i in $(seq 1 "$reps"); do
              ./output/klogg_itests.exe -platform offscreen "$@" > case_output.log 2>&1
              rc=$?
              matched=$(matched_cases case_output.log)
              if [ -z "$matched" ]; then
                matched=$(sed -n 's/^test cases: *\([0-9][0-9]*\).*/\1/p' case_output.log | tail -1)
              fi
              if [ "$rc" -ne 0 ]; then
                failed=$((failed+1))
                cp case_output.log "case_failures/fail_${safe}_${i}.log"
              elif [ "$matched" != "$expected" ]; then
                mismatched=$((mismatched+1))
                cp case_output.log "case_failures/mismatch_${safe}_${i}.log"
              else
                ok=$((ok+1))
              fi
            done
            echo "RESULT spec='$*' expected=$expected ok=$ok failed=$failed mismatched=$mismatched runs=$reps"
          }

          PRECEDING=(
            "Logdata decoding lines"
            "Logdata reading changing file"
            "Attaching log data to files"
            "marks in filtered log data"
          )
          run_spec 1 10 "search for regex"
          for c in "${PRECEDING[@]}"; do
            run_spec 2 10 "$c" "search for regex"
          done
          ARGS=()
          for c in "${PRECEDING[@]}"; do
            ARGS+=("$c")
            run_spec "${#ARGS[@]}" 10 "${ARGS[@]}"
          done
          run_spec 5 10 "${ARGS[@]}" "search for regex"
          run_spec 8 10 "${ARGS[@]}" "search for regex" "marks and matches in filtered log data" "Crawler widget search" "Main window tests"
          echo "=== full suite repeats ==="
          ctest -R klogg_itests --repeat until-fail:20 --timeout 300 --output-on-failure
      - name: Upload failing case logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-failures-${{ matrix.config.label }}
          path: build_root/case_failures
          if-no-files-found: ignore
