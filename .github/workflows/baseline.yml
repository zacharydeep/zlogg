name: "Baseline Build"

# Secret-free build/test gate for the locked toolchain (C++20 / Qt 6.8 / CMake).
# This is the authoritative milestone-1 gate: it builds `ci_build` and runs the
# full ctest suite on Windows and macOS. Unlike ci-build.yml it does not sign,
# notarize or package, so it needs no release secrets and stays green.
# Sentry is disabled here: its bundled crashpad does not configure against the
# macOS 14 runner SDK. Sentry-enabled builds are covered by ci-build.yml.
# See VERIFIED_TOOLCHAIN.md.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Baseline (${{ matrix.config.os }}-${{ matrix.config.os_version }}, Qt ${{ matrix.config.qt_version }}, ${{ matrix.config.label }})
    strategy:
      fail-fast: false
      # EXPERIMENT: three independent Windows LTO builds. The itests failure is
      # decided per build, so a single build proves nothing: the old baseline was
      # 1 bad build out of 3 with KLOGG_USE_LTO=ON.
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: lto-1
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=ON -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: lto-2
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=ON -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: lto-3
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=ON -DKLOGG_QT6_MIN_VERSION=6.8

    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Set brew env
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        if: ${{ matrix.config.os == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build
      - uses: ./.github/actions/agent-run-tests

      - name: Repeat integration tests 20 times
        shell: sh
        run: |
          cd $KLOGG_BUILD_ROOT
          ctest -R klogg_itests --repeat until-fail:20 --timeout 300 --output-on-failure
