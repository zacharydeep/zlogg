name: "Baseline Build"

# Secret-free build/test gate for the locked toolchain (C++20 / Qt 6.8 / CMake).
# This is the authoritative milestone-1 gate: it builds `ci_build` and runs the
# full ctest suite on Windows and macOS. Unlike ci-build.yml it does not sign,
# notarize or package, so it needs no release secrets and stays green.
# Sentry is disabled here: its bundled crashpad does not configure against the
# macOS 14 runner SDK. Sentry-enabled builds are covered by ci-build.yml.
# See VERIFIED_TOOLCHAIN.md.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - '*.md'
      - 'latest.json'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Baseline (${{ matrix.config.os }}-${{ matrix.config.os_version }}, ${{ matrix.config.label }})
    strategy:
      fail-fast: false
      # EXPERIMENT: three plain builds and three AddressSanitizer builds,
      # all running the same two-case reproducer many times.
      matrix:
        config:
          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: plain-1
            asan: false
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: plain-2
            asan: false
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: plain-3
            asan: false
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: asan-1
            asan: true
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8 -DWARNINGS_AS_ERRORS=OFF

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: asan-2
            asan: true
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8 -DWARNINGS_AS_ERRORS=OFF

          - os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            label: asan-3
            asan: true
            sanity_reps: 10
            pair_reps: 20
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8 -DWARNINGS_AS_ERRORS=OFF
    runs-on: ${{ matrix.config.os }}-${{ matrix.config.os_version }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Enable AddressSanitizer
        if: ${{ matrix.config.asan }}
        shell: sh
        run: |
          echo "_CL_=-fsanitize=address" >> $GITHUB_ENV
          echo "_LINK_=-INCREMENTAL:NO" >> $GITHUB_ENV

      - name: Setup Xcode
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Set brew env
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        if: ${{ matrix.config.os == 'macos' }}
        shell: sh
        run: brew install ragel

      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        if: ${{ matrix.config.os == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - uses: ./.github/actions/agent-build

      - name: Verify ASan is linked
        if: ${{ matrix.config.asan }}
        shell: sh
        run: |
          cd "$KLOGG_BUILD_ROOT"
          dumpbin //nologo //dependents output/klogg_itests.exe | grep -i asan || { echo "::error::ASan runtime is not linked"; exit 1; }
      - name: Reproduce with the two-case spec
        shell: sh
        env:
          SANITY_REPS: ${{ matrix.config.sanity_reps }}
          PAIR_REPS: ${{ matrix.config.pair_reps }}
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cd "$KLOGG_BUILD_ROOT"
          rm -rf case_failures && mkdir -p case_failures
          matched_cases() { sed -n 's/.*in \([0-9][0-9]*\) test case.*/\1/p' "$1" | tail -1; }
          run_spec() {
            expected="$1"; reps="$2"; spec="$3"
            ok=0; failed=0; crashed=0; hung=0; mismatched=0
            safe=$(echo "$spec" | tr -c 'A-Za-z0-9._-' '_')
            for i in $(seq 1 "$reps"); do
              ./output/klogg_itests.exe -platform offscreen "$spec" > case_output.log 2>&1 &
              pid=$!
              ( sleep 90; kill -9 $pid 2>/dev/null ) &
              watcher=$!
              if wait $pid; then rc=0; else rc=$?; fi
              kill $watcher 2>/dev/null || true
              wait $watcher 2>/dev/null || true
              matched=$(matched_cases case_output.log)
              if [ "$rc" -ne 0 ]; then
                failed=$((failed+1))
                if [ "$rc" -eq 137 ] || [ "$rc" -eq 124 ]; then
                  hung=$((hung+1))
                  cp case_output.log "case_failures/hang_${safe}_${i}.log"
                fi
                if [ "$rc" -ge 128 ] && [ "$rc" -ne 137 ]; then crashed=$((crashed+1)); fi
                cp case_output.log "case_failures/fail_${safe}_${i}.log"
                if grep -q "AddressSanitizer" case_output.log; then
                  echo "--- ASAN REPORT run $i ---"
                  sed -n '/AddressSanitizer/,+40p' case_output.log | head -80
                fi
              elif [ "$matched" != "$expected" ]; then
                mismatched=$((mismatched+1))
                cp case_output.log "case_failures/mismatch_${safe}_${i}.log"
              else
                ok=$((ok+1))
              fi
            done
            echo "RESULT spec='$spec' expected=$expected ok=$ok failed=$failed crashed=$crashed hung=$hung mismatched=$mismatched runs=$reps"
          }
          SEARCH="Scenario: search for regex"
          MARKS="Scenario: marks in filtered log data"
          run_spec 1 "$SANITY_REPS" "$SEARCH"
          run_spec 2 "$PAIR_REPS" "$MARKS,$SEARCH"
      - name: Upload failing case logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-failures-${{ matrix.config.label }}
          path: build_root/case_failures
          if-no-files-found: ignore
