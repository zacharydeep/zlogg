name: "EXP ASan"

# Temporary diagnostic workflow for the Windows-only klogg_itests crash.
# Branch-only.
#
# Findings so far:
#  - the crash only happens with MSVC LTO and is *flaky* (one run passed), so
#    every variant repeats the integration tests to get a usable signal;
#  - passing "/fsanitize=address" via -DCMAKE_CXX_FLAGS both loses CMake's
#    default MSVC flags (/EHsc) and gets mangled by Git-Bash, so the sanitizer
#    flag goes through the CXXFLAGS/CFLAGS environment instead.
on:
  workflow_dispatch:

jobs:
  exp:
    name: "EXP (${{ matrix.config.variant }})"
    strategy:
      fail-fast: false
      matrix:
        config:
          - variant: control-lto
            cxxflags: ""
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - variant: asan
            cxxflags: /fsanitize=address
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_USE_LTO=OFF -DKLOGG_QT6_MIN_VERSION=6.8

    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CXXFLAGS: ${{ matrix.config.cxxflags }}
      CFLAGS: ${{ matrix.config.cxxflags }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: sh
        run: |
          mkdir -p $KLOGG_BUILD_ROOT
          cd $KLOGG_BUILD_ROOT
          cmake $KLOGG_CMAKE_OPTS -DCPM_SOURCE_CACHE=$KLOGG_WORKSPACE/cpm_cache -DKLOGG_OVERRIDE_MALLOC=OFF $KLOGG_WORKSPACE
          cmake --build . -t ci_build

      - name: Run integration tests repeatedly
        shell: sh
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:halt_on_error=0
        run: |
          cd $KLOGG_BUILD_ROOT
          ctest -R klogg_itests --repeat until-fail:20 --output-on-failure > ctest_rep.log 2>&1 || true
          echo "=========== summary ==========="
          grep -nE "Test #|Passed|Failed|SegFault|SEGV|AddressSanitizer|SUMMARY|Repeated|##\[error\]" ctest_rep.log | tail -50
          echo "=========== tail ==========="
          tail -100 ctest_rep.log
