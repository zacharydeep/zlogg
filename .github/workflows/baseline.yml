name: "EXP ICF"

# Temporary diagnostic workflow for the Windows-only klogg_itests crash.
# Branch-only.
#
# Status:
#  - the crash happens only with MSVC LTO and is flaky, so every variant runs
#    the integration tests repeatedly (--repeat until-fail:20);
#  - a single run with -OPT:NOICF passed, which hints that /OPT:ICF (COMDAT
#    folding) is the trigger. This run compares control vs NOICF with repeats.
on:
  workflow_dispatch:

jobs:
  exp:
    name: "EXP (${{ matrix.config.variant }})"
    strategy:
      fail-fast: false
      matrix:
        config:
          - variant: control-lto
            os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DKLOGG_QT6_MIN_VERSION=6.8

          - variant: noicf
            os: windows
            os_version: 2022
            qt_version: 6.8.3
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat
            arch: x64
            cmake_opts: -DKLOGG_USE_SENTRY=OFF -DCMAKE_EXE_LINKER_FLAGS=-OPT:NOICF -DKLOGG_QT6_MIN_VERSION=6.8

    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ./.github/actions/agent-build

      - name: Verify link flags
        shell: sh
        run: |
          cd $KLOGG_BUILD_ROOT
          grep -c "OPT:NOICF" build.ninja || true

      - name: Repeat integration tests
        shell: sh
        run: |
          cd $KLOGG_BUILD_ROOT
          ctest -R klogg_itests --repeat until-fail:20 --output-on-failure > rep.log 2>&1 || true
          echo "=========== summary ==========="
          grep -nE "Test #|Passed|Failed|SegFault|SEGV|Repeated|Exception" rep.log | tail -30
          echo "=========== tail ==========="
          tail -60 rep.log
