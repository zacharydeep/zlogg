name: "EXP flake rate"

# Branch-only. Measures how often klogg_itests fails on Windows for the two
# Windows build configurations, using several *independent builds* (a single
# build is not enough: the failure is intermittent per run).
on:
  workflow_dispatch:

jobs:
  flake:
    name: "flake (${{ matrix.label }} #${{ matrix.replica }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: lto-off, lto: OFF, replica: 1, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
          - { label: lto-off, lto: OFF, replica: 2, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
          - { label: lto-off, lto: OFF, replica: 3, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
          - { label: lto-on, lto: ON, replica: 1, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
          - { label: lto-on, lto: ON, replica: 2, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
          - { label: lto-on, lto: ON, replica: 3, os: windows, os_version: 2022, qt_version: 6.8.3, qt_arch: win64_msvc2022_64, qt_modules: qt5compat, arch: x64 }
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: bash
        run: |
          cmake -S "$KLOGG_WORKSPACE" -B "$KLOGG_BUILD_ROOT" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DKLOGG_GENERIC_CPU=ON \
            -DKLOGG_USE_SENTRY=OFF \
            -DKLOGG_USE_LTO=${{ matrix.lto }} \
            -DKLOGG_QT6_MIN_VERSION=6.8 \
            -DKLOGG_OVERRIDE_MALLOC=OFF \
            -DCPM_SOURCE_CACHE="$KLOGG_WORKSPACE/cpm_cache"
          cmake --build "$KLOGG_BUILD_ROOT" -t ci_build

      - name: Run klogg_itests 20 times
        shell: bash
        run: |
          cd "$KLOGG_BUILD_ROOT"
          pass=0; fail=0; first_crash=""
          for i in $(seq 1 20); do
            if ctest -R '^klogg_itests$' --output-on-failure > "run_$i.log" 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1))
              [ -z "$first_crash" ] && first_crash="run_$i.log"
            fi
          done
          echo "=================================================="
          echo "RESULT lto=${{ matrix.lto }} replica=${{ matrix.replica }} PASS=$pass FAIL=$fail"
          echo "=================================================="
          if [ -n "$first_crash" ]; then
            echo "--- first failing run: $first_crash ---"
            grep -nE "Scenario|FAILED|SIGSEGV|SegFault|Stack trace|in [A-Za-z_]+::" "$first_crash" | tail -40 || true
          fi
