name: "EXP validate ICF fix"

# Branch-only validation of the /OPT:NOICF fix: build with the default options
# (LTO on, ICF disabled by the root CMakeLists) and repeat the integration tests.
# Before the fix, this exact configuration segfaulted intermittently.
on:
  workflow_dispatch:

jobs:
  validate:
    name: "validate"
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/klogg-version
      - uses: ./.github/actions/prepare-workspace-env

      - name: Prepare dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ./.github/actions/agent-build

      - name: Check link flags
        shell: sh
        run: |
          cd $KLOGG_BUILD_ROOT
          echo "NOICF occurrences in build.ninja:"
          grep -c "OPT:NOICF" build.ninja || true

      - name: Repeat integration tests
        shell: sh
        run: |
          cd $KLOGG_BUILD_ROOT
          ctest -R klogg_itests --repeat until-fail:20 --output-on-failure > rep.log 2>&1 || true
          echo "=========== summary ==========="
          grep -nE "Test #|tests passed|tests failed|SegFault|SEGV|Repeated|Exception" rep.log | tail -30
          echo "=========== tail ==========="
          tail -50 rep.log
